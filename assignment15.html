<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <form>
        <fieldset>
            <legend>Personal Details</legend>

            <label for="name">NAME:</label>
            <input type="text" name="name" id="name">
            <br><br>

            <label for="email">EMAIL:</label>
            <input type="email" name="email" id="email">
            <br><br>

            <label for="password">PASSWORD:</label>
            <input type="password" name="password" id="password">
            <br><br>

            <label>GENDER:</label>
            <input type="radio" name="gen" id="male" value="male">
            <label for="male">MALE</label>

            <input type="radio" name="gen" id="female" value="female">
            <label for="female">FEMALE</label>
            <br><br>

            <label>HOBBIES:</label>
            <input type="checkbox" name="hobby1" id="cricket" value="cricket">
            <label for="cricket">Cricket</label>

            <input type="checkbox" name="hobby2" id="coat" value="coat">
            <label for="coat">Coat</label>
            <br><br>

            <label for="dob">DATE OF BIRTH:</label>
            <input type="date" name="dob" id="dob">

        </fieldset>
    </form>
</body>
</html>
